  - generic [ref=e40]:
    - 'heading "Legislação e Regulamentos Licita Mais Brasil: Seu Guia Completo" [level=1] [ref=e41]'
    - paragraph [ref=e42]: Nesta seção, reunimos as principais legislações vigentes no Brasil e os regulamentos da Plataforma Licita Mais Brasil. Nosso objetivo é simplificar o acesso e a consulta a esses documentos essenciais para todos os nossos usuários.
