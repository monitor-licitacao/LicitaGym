# Supabase local — licitagym PNCP
# Nota: [functions] quebra o parser legacy do CLI 2.117 neste ambiente;
# use `supabase functions deploy --no-verify-jwt` para sync jobs, ou configure no dashboard.

project_id = "licitagym"

[api]
enabled = true
port = 54321
# private: sync/provenance — só service_role (GRANT na migration 001)
schemas = ["public", "graphql_public", "private"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15
health_timeout = "5m"

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
